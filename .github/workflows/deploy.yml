name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      APP_ENV: production
      APP_URL: http://localhost
      DOCKER_IMAGE: ghcr.io/${{ github.repository }}/peserta1:${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      - name: Install PHP dependencies
        run: |
          if [ -f composer.json ]; then
            composer install --no-interaction --prefer-dist --no-progress
          else
            echo "No composer.json found; skipping PHP dependency install."
          fi

      - name: Install Node dependencies
        run: |
          if [ -f package.json ]; then
            npm ci
          else
            echo "No package.json found; skipping Node dependency install."
          fi

      - name: Run unit tests
        run: |
          if [ -f vendor/bin/phpunit ]; then
            php vendor/bin/phpunit --testsuite=Unit --do-not-cache-result
          elif [ -f artisan ]; then
            php artisan test
          elif [ -f phpunit.xml ] || [ -f phpunit.xml.dist ]; then
            if [ -f vendor/bin/phpunit ]; then
              php vendor/bin/phpunit --do-not-cache-result
            else
              echo "PHPUnit executable not found after dependency install; skipping unit tests."
            fi
          else
            echo "No unit test runner found; skipping unit tests."
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build NGINX and PHP runtime images
        run: docker compose build nginx php

      - name: Build final Docker image
        run: docker build -t "${DOCKER_IMAGE}" .

      - name: Deploy services
        run: docker compose up -d
